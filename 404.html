<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2C1810; /* Bistre background */
            font-family: 'Arial', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #E6D3A7; /* Light beige text */
        }

        .container {
            text-align: center;
            position: relative;
        }

        .error-code {
            font-size: 15rem;
            font-weight: bold;
            color: #C6A378; /* Bistre brown */
            text-shadow: 
                0 0 10px rgba(198, 163, 120, 0.5),
                0 0 20px rgba(198, 163, 120, 0.3),
                0 0 30px rgba(198, 163, 120, 0.2);
            position: relative;
            z-index: 1;
            animation: float 3s ease-in-out infinite, 
                       pulse 2s ease-in-out infinite alternate;
            letter-spacing: -10px;
        }

        .error-message {
            font-size: 2rem;
            margin-top: -3rem;
            color: #D4B996; /* Lighter bistre */
            animation: fadeInOut 4s ease-in-out infinite;
        }

        .ornament {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }

        .ornament::before,
        .ornament::after {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #A6855E; /* Darker bistre */
            border-radius: 50%;
            opacity: 0.6;
        }

        .ornament:nth-child(1)::before {
            top: 10%;
            left: 15%;
            animation: twinkle 2s infinite;
        }

        .ornament:nth-child(1)::after {
            bottom: 20%;
            right: 25%;
            animation: twinkle 3s infinite 0.5s;
        }

        .ornament:nth-child(2)::before {
            top: 30%;
            right: 15%;
            animation: twinkle 2.5s infinite 0.2s;
        }

        .ornament:nth-child(2)::after {
            bottom: 40%;
            left: 20%;
            animation: twinkle 1.8s infinite 0.7s;
        }

        .ornament:nth-child(3)::before {
            top: 60%;
            left: 10%;
            animation: twinkle 2.2s infinite 0.4s;
        }

        .ornament:nth-child(3)::after {
            bottom: 10%;
            right: 10%;
            animation: twinkle 2.7s infinite 0.9s;
        }

        .home-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 2rem;
            background-color: transparent;
            color: #E6D3A7;
            text-decoration: none;
            border: 2px solid #A6855E;
            border-radius: 30px;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .home-link:hover {
            background-color: #A6855E;
            color: #2C1810;
            box-shadow: 0 0 15px rgba(166, 133, 94, 0.6);
        }

        .home-link::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(230, 211, 167, 0.3),
                transparent
            );
            transition: 0.5s;
        }

        .home-link:hover::before {
            left: 100%;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
            100% {
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                text-shadow: 
                    0 0 10px rgba(198, 163, 120, 0.5),
                    0 0 20px rgba(198, 163, 120, 0.3),
                    0 0 30px rgba(198, 163, 120, 0.2);
            }
            100% {
                text-shadow: 
                    0 0 15px rgba(198, 163, 120, 0.6),
                    0 0 30px rgba(198, 163, 120, 0.4),
                    0 0 45px rgba(198, 163, 120, 0.3);
            }
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0.7;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.2);
            }
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 10rem;
            }
            
            .error-message {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 8rem;
            }
            
            .error-message {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="error-code">404</h1>
        <p class="error-message">Oops! Page Lost in the Shadows</p>
        <a href="/" class="home-link">Return to Safety</a>
        
        <!-- Decorative elements -->
        <div class="ornament"></div>
        <div class="ornament"></div>
        <div class="ornament"></div>
    </div>
</body>
</html>
